spring.application.name=medicas
citas.cancelacion.horas-minimas=2
citas.reservas.max-activas-por-paciente=3
citas.zona-horaria=America/Bogota
spring.jpa.hibernate.ddl-auto=validate
spring.web.locale=es
spring.web.locale-resolver=fixed
server.forward-headers-strategy=native

#JWT
jwt.secret=${JWT_SECRET}
jwt.expiracion-minutos=60

# CORREO
citas.mail.remitente=no-responder@citas.dev
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
citas.recordatorio.cron=0 */15 * * * *
citas.reintentos.cron=0 */10 * * * *
citas.reintentos.max-intentos=3

# VERIFICACION DE EMAIL
citas.front.url=${FRONT_URL:http://localhost:4200}
citas.verificacion.vigencia=24h
citas.recuperacion.vigencia=30m

# CERTIFICADOS
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=7MB
citas.certificados.directorio=${CERTIFICADOS_DIR:./almacenamiento/certificados}

# LIMITES DE INTENTOS (rate limit)
# Por IP: frena a quien prueba una contrasena contra muchas cuentas
citas.seguridad.login.max-por-ip=20
citas.seguridad.login.ventana-por-ip=15m
citas.seguridad.registro.max-por-ip=5
citas.seguridad.registro.ventana-por-ip=1h
citas.seguridad.reenvio.max-por-ip=5
citas.seguridad.reenvio.ventana-por-ip=1h
citas.seguridad.recuperacion.max-por-ip=5
citas.seguridad.recuperacion.ventana-por-ip=1h
# Por cuenta: frena la fuerza bruta contra un email, aunque venga de muchas IPs
citas.seguridad.login.max-fallos-por-cuenta=5
citas.seguridad.login.ventana-por-cuenta=15m
citas.seguridad.limpieza.cron=0 */10 * * * *

# DEMO DEL PORTAFOLIO: recrea la clinica de ejemplo al arrancar y cada noche (demo/clinica-demo.sql).
# BORRA todos los datos menos los administradores reales: solo para un despliegue de demostracion
citas.demo.habilitada=${DEMO_HABILITADA:false}
citas.demo.reinicio.cron=0 0 3 * * *

# ADMIN INICIAL (solo si no existe ningun admin)
citas.admin-inicial.email=${ADMIN_EMAIL:}
citas.admin-inicial.password=${ADMIN_PASSWORD:}
citas.admin-inicial.tipo-documento=${ADMIN_TIPO_DOCUMENTO:CC}
citas.admin-inicial.numero-documento=${ADMIN_DOCUMENTO:}
